<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>セミナー生物 論述問題 一問一答</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="hwrap">
    <div class="hrow">
      <div>
        <h1>セミナー生物 論述問題 一問一答</h1>
        <p class="sub">全<span id="totalq"></span>問(No.343〜471)・13単元 · 記述対策</p>
      </div>
      <div class="hbtns">
        <span class="counter">進んだ問題数 <span id="done">0</span> / <span id="totalq2"></span></span>
        <button id="wt" class="pill">⏱ タイマー表示中</button>
        <div class="sizes" id="sizes">
          <button data-s="0" class="on">標準</button><button data-s="1">大</button><button data-s="2">特大</button>
        </div>
      </div>
    </div>
    <div id="timerbox">
      <span class="time" id="tdisp">00:00:00</span>
      <button id="tstart" class="tbtn">スタート</button>
      <button id="treset" class="tbtn ghost">リセット</button>
      <span class="thint">📌 記述にかかった時間を測って、時間を意識しながら書く練習をしましょう</span>
    </div>
  </div>
</header>
<main>
  <details class="filters" id="filters">
    <summary>▾ 出題範囲・条件の設定(単元 / 出典 / 基本・発展 / 理解度 / 検索)</summary>
    <div class="fchips" id="chapchips"></div>
    <div class="flabel">出典</div>
    <div class="fchips" id="srcchips"></div>
    <div class="frow2">
      <div class="seg" id="lvseg">
        <button data-v="-1" class="on">すべて</button><button data-v="0">基本問題</button><button data-v="1">発展問題</button>
      </div>
      <div class="seg" id="stseg">
        <button data-v="-1" class="on">全状態</button>
        <button data-v="1">理解した<span id="c1"></span></button>
        <button data-v="2">うろ覚え<span id="c2"></span></button>
        <button data-v="3">要復習<span id="c3"></span></button>
      </div>
      <input id="search" placeholder="🔍 キーワード検索(例:光合成)" />
      <button id="fclear" class="clearbtn">条件クリア</button>
    </div>
  </details>
  <div class="pos"><span>第 <b id="posn">1</b> 問目 / 全<span id="deckn"></span>問<span id="randtag"></span></span><span class="posr"><button id="rand" class="randbtn">🎲 ランダム出題</button><span class="kbhint">⌨️ ← / → キーでも移動できます</span></span></div>
  <article class="qcard" id="qcard"></article>
  <div class="nav">
    <button id="prev" class="nbtn">← 前の問題</button>
    <button id="home" class="nbtn">最初に戻る</button>
    <button id="next" class="nbtn next">次の問題 →</button>
  </div>
  <footer>
    <p>学習状態・文字サイズ・タイマー設定は自動保存されます(同じ端末・ブラウザで有効)</p>
    <p style="margin-top:4px">セミナー生物「論述問題」(No.343〜471)にもとづく学習用アプリ</p>
  </footer>
</main>
<script src="script.js"></script>
</body>
</html>
